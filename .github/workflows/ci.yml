name: Test

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify the release receipt
        run: python3 scripts/verify_public_export.py

      - name: Test the repository surface
        run: python3 -m unittest discover -s tests -v

      - name: Test the plugin
        run: python3 -m unittest discover -s plugins/codex-binder-lane/tests -v

      - name: Compile Python sources
        run: python3 -m compileall -q scripts tests plugins/codex-binder-lane
